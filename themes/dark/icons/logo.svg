<linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="120" y1="60" x2="680" y2="720"><stop offset="0" stop-color="#5b90c8"/><stop offset="0.4" stop-color="#3f6ba4"/><stop offset="1" stop-color="#2a4676"/></linearGradient>
