<!-- The tplay mark: a bolt over a play triangle on a rounded plate. Coordinates
     are the original 776x776 artwork's own. The plate is four fitted corner
     circles joined by external tangents, so it is exact; the triangle is three
     corners, and the bolt a spline through its traced outline with the corners
     too small to see dropped. The triangle is masked off under the bolt,
     because the bolt covers its left half and the only boundary there that
     matters is the bolt's own edge. Shading is one gradient per shape, not
     the render's per-limb lighting. -->
