<!-- The tplay mark: a bolt over a play triangle on a rounded plate.
     Coordinates are the original 776x776 artwork's own. The plate is four
     fitted corner circles joined by external tangents, so it is exact; the
     triangle and the bolt are their traced outlines with the collinear
     vertices dropped and the real corners rounded, which is smoother than
     the trace and a third of the bytes. Shading is one gradient per shape,
     not the render's per-limb lighting. -->
