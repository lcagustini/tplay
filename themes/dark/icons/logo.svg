<linearGradient id="bolt" gradientUnits="userSpaceOnUse" x1="120" y1="60" x2="680" y2="720"><stop offset="0" stop-color="#ffcf6a"/><stop offset="0.3" stop-color="#ffa63f"/><stop offset="0.65" stop-color="#f5892c"/><stop offset="1" stop-color="#dc6520"/></linearGradient>
