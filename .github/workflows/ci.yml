name: CI

# A version tag is the only trigger: pushing v1.4.0 runs the gates, and — only
# because they passed — the release. The version is the tag you typed, so
# nothing has to be bumped in Cargo.toml to release.

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # cpal/ALSA is the only build-time system dep. X11, xkbcommon and wayland
      # arrive via dlopen, and the tests are headless — no xvfb, no audio device.
      #
      # mesa-vulkan-drivers is for `the_callback_paints_the_pane_and_nothing_
      # outside_it`, the one test that runs a real wGPU device: lavapipe is a
      # software Vulkan ICD, so it renders the view and reads the pixels back
      # with no GPU. Without it that test skips, which is exactly how a broken
      # viewport or a shader that draws nothing survives to a release.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

      # themes/ ships because theme_dirs() looks in <exe_dir>/themes — without
      # it the binary renders with no icons.
      - run: |
          cargo build --release --locked
          mkdir -p dist/tplay
          cp target/release/tplay dist/tplay/
          cp -r themes dist/tplay/
          tar -czf dist/tplay-linux-x86_64.tar.gz -C dist tplay

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/tplay-linux-x86_64.tar.gz
