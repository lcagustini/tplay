[package]
name = "tplay"
version = "0.2.0"
edition = "2021"

[lib]
name = "tplay"
path = "src/lib.rs"

[dependencies]
eframe    = "0.36"
# The logging facade. Already in the tree via eframe -> winit, so nothing new
# compiles. It is here so wgpu's own pipeline diagnostics reach a human: nothing
# else installs a logger, and `log` records are dropped when no one does.
log       = "0.4"
# symphonia-all enables MP3, FLAC, OGG, WAV, AAC decoding
rodio     = { version = "0.22", features = ["symphonia-all"] }
# Direct symphonia access so we can probe MP3 duration ourselves
symphonia = { version = "0.5", features = ["all"] }
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs      = "7.0"
# Docking layout: tab drag/split/tear-off; serde for layout persistence
egui_dock = { version = "0.21", features = ["serde"] }

# PNG/JPEG decode for album covers, plus BMP for theme frames
# "bmp" is not decoration: a Winamp skin ships .bmp, so the nine-slice frames
# read the format the reference format actually is.
image     = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# Theme icon rasterization. default-features = false drops `text` + `system-fonts`,
# and with them fontdb/rustybuzz: no icon SVG contains text, and letting usvg scan
# system fonts would fight theme::install_fallback_fonts over egui's font families.
resvg     = { version = "0.48", default-features = false }
lofty = "0.25.4"
smb2 = "0.26"
tokio = { version = "1.53.1", features = ["rt", "net", "time"] }

[dev-dependencies]
# The visualizer harness, so the tests can validate the WGSL the same way the
# driver does. `wgpu` re-exports `naga`, so this names nothing new.
wgpu = "30"
