[package]
name = "tplay"
version = "0.1.0"
edition = "2021"

[lib]
name = "tplay"
path = "src/lib.rs"

[dependencies]
eframe    = "0.30"
# symphonia-all enables MP3, FLAC, OGG, WAV, AAC decoding
rodio     = { version = "0.19", features = ["symphonia-all"] }
rfd       = "0.14"
# Direct symphonia access so we can probe MP3 duration ourselves
symphonia = { version = "0.5", features = ["all"] }
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs      = "5.0"
# Docking layout: tab drag/split/tear-off; serde for layout persistence
egui_dock = { version = "0.15", features = ["serde"] }
# PNG decode for theme icons (loaded synchronously into egui textures at startup)
image     = { version = "0.25", default-features = false, features = ["png"] }
lofty = "0.25.4"
